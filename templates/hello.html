<div style="max-width:620px;margin:0 auto">
  <p class="clock" data-clock style="text-align:right;margin-bottom:22px">In Northampton, on UK time.</p>
  <p style="margin:0 0 1em;font-size:1.25em;font-style:italic">{{6.1}}</p>
  <p style="margin:0 0 1em">{{6.11}}</p>
  <p style="margin:0 0 1em">{{6.12}}</p>
  <p style="margin:0 0 1em">{{6.13}}</p>
  <form data-tool="note" style="margin:0 0 1.4em">
    <label for="note" class="sr">Your note</label>
    <textarea id="note" class="field" rows="4"></textarea>
    <button type="button" class="btn solid" style="margin-top:8px">Send</button>
    <p class="boxline">{{6.2}}</p>
  </form>
  <span class="hand" style="font-size:1.9em;margin:0 0 4px">{{6.14}}</span>
  <p style="margin:0;font-size:.88em;font-style:italic;color:var(--muted)">{{6.15}}</p>
</div>

<section class="sec" style="max-width:620px;margin-left:auto;margin-right:auto">
  <h2 class="h2 small" style="margin-bottom:6px">{{6.3}}</h2>
  <p class="sub" style="margin:0 auto 18px">{{6.31}}</p>
  <div data-tool="door">
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap">
      <button type="button" class="pick" aria-pressed="true">I’m new</button>
      <button type="button" class="pick" aria-pressed="false">I’ve been here</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">
      <input class="field" aria-label="Your name" placeholder="Your name" style="flex:1 1 180px;min-width:0;padding:10px">
      <input class="field" aria-label="Three words" placeholder="Three words" style="flex:2 1 240px;min-width:0;padding:10px">
    </div>
    <div class="card">
      <p class="top">New to the house</p>
      <span class="hand">Your name</span>
      <p class="words">three words here</p>
    </div>
  </div>
</section>

<section class="sec" style="text-align:center">
  <h2 class="h2 small" style="margin-bottom:10px">{{6.4}}</h2>
  <p style="margin:0;font-style:italic">{{6.41}}</p>
</section>

<header style="margin-bottom:clamp(26px,5vw,44px)">
  <h1 class="h1">{{2.1}}</h1>
  <p class="sub">{{2.11}}</p>
</header>
<div class="read" style="margin-bottom:clamp(30px,5vw,48px)">
  <p class="drop">{{2.12}}</p>
</div>
<div class="storyline">
  <svg class="ink" aria-hidden="true" viewBox="0 0 60 1000" preserveAspectRatio="none">
    <path d="M 34 0 C 8 70, 54 130, 30 205 C 10 270, 52 320, 28 395 C 8 455, 54 515, 32 590 C 12 650, 50 705, 28 775 C 10 835, 50 880, 34 1000" fill="none" stroke="currentColor" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round"></path>
  </svg>
  {{#each 2.2 depth=2}}
  <article class="moment">
    <p class="when">{{.}}</p>
    <h2>{{.1}}</h2>
    <p>{{.2}}</p>
    {{#if .3}}<div class="figs">{{#refs .3}}<figure class="fig{{#if .3}} wide{{/if}}"><img src="{{root}}/pictures/{{plain:.}}" alt="{{plain:.2}}"><figcaption>{{.1}}</figcaption></figure>{{/refs}}</div>{{/if}}
  </article>
  {{/each}}
</div>
<div class="tools" data-share data-comment-at="2"></div>
<div style="text-align:center;margin-top:10px">
  <svg class="mark" viewBox="0 0 390 340" role="img" aria-label="{{plain:7.2912}}" style="width:clamp(120px,20vw,170px);margin:0 auto 14px"><use href="{{root}}/assets/mark.svg#m"></use></svg>
  <p style="margin:0 auto;max-width:520px;font-size:1.15em;font-style:italic">{{2.3}}</p>
</div>

# A private preview of the site from the live beach, with the page map and page lines passed in as an
# override, so a restructure can be seen before its yes. Run by hand; it deploys nothing and commits nothing.
name: preview

on:
  workflow_dispatch:
    inputs:
      overrides:
        description: 'JSON laid over spine:life-work child by child (for example a new 7.1 and 7.5)'
        required: false
        default: '{}'

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the generator
        run: python3 -m unittest discover -s tests
      - name: The overrides, outside the repository
        env:
          OVERRIDES: ${{ inputs.overrides }}
        run: printf '%s' "$OVERRIDES" > "$RUNNER_TEMP/overrides.json" && python3 -c "import json,os; json.load(open(os.environ['RUNNER_TEMP']+'/overrides.json'))"
      - name: Make the preview from the beach
        run: >-
          python3 tools/generate.py --preview
          --words "$RUNNER_TEMP/overrides.json"
          --site "https://www.matthewbushell.life"
          --root ""
          --out "$RUNNER_TEMP/preview"
          --record "$RUNNER_TEMP/record.json"
          --report "$RUNNER_TEMP/report.json"
      - name: Say what happened
        run: cat "$RUNNER_TEMP/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview
          path: |
            ${{ runner.temp }}/preview
            ${{ runner.temp }}/report.json
          retention-days: 1

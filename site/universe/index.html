<style>
/* The universe alone: the live Pscale sky of The Approach (film:the-approach 6.42, 6.8, 6.82) with the film and the dial taken away.
   Every block is a star; a star opens into its places as moons; a moon opens into its own, as far down as the block goes. */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#04060b}
.uni{--ink:#efe6d6;--dim:#b9ab90;--gold:#d9b36c;
  position:relative;height:100vh;height:100svh;overflow:hidden;background:#04060b;color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.uni #sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.uni.dragging #sky{cursor:grabbing}
.uni button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.uni button:focus-visible{outline:2px solid #ff5d86;outline-offset:3px}
.uni [hidden]{display:none!important}
.ubtn{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:0;padding:0 18px;border:1.5px solid #eadfc4;border-radius:999px;
  background:rgba(12,14,26,.94);color:#fff8ea;font-family:'Cormorant Garamond',Garamond,serif;font-size:19px;font-weight:600;letter-spacing:.03em;line-height:1.1;white-space:nowrap;
  box-shadow:0 2px 14px rgba(0,0,0,.55)}
.ubtn:hover{background:rgba(44,50,76,.96)}
.ubtn:disabled{opacity:.36;cursor:default}
.ubtn.go{background:#c21d4e;border-color:#ff8aa6;color:#fff;box-shadow:0 0 26px rgba(194,29,78,.5)}
.ucorner{position:absolute;z-index:8;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;padding:5px;border-radius:32px;background:rgba(3,5,12,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ucorner .ubtn{padding:0 14px;font-size:18px}
.ucorner .uhere{border-color:#9ff2e6;color:#e6fffb}
.uni.walking .ucorner .uhere,.uni.walking .ucorner .ufindb,.uni.walking .ucorner #showb{display:none}
.uchip{position:absolute;z-index:7;top:calc(62px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));min-height:40px;padding:0 14px;font-size:17px;border-color:#e8c98a;color:#ffeccb;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;display:inline-block}
.uni.walking .uchip{display:none}
.ufind{position:absolute;z-index:9;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 24px));box-sizing:border-box;padding:10px;border-radius:18px;background:rgba(6,9,22,.96);border:1px solid rgba(238,242,255,.3);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ufind input{box-sizing:border-box;width:100%;height:48px;padding:0 14px;border-radius:10px;border:1px solid #8a6a3a;background:#0b0f1e;color:#fff8ea;font:500 20px 'Cormorant Garamond',Georgia,serif;outline:none;user-select:text;-webkit-user-select:text}
.ufind input:focus{border-color:#e8c98a}
.ufind ul{list-style:none;margin:8px 0 0;padding:0;max-height:min(46vh,340px);overflow-y:auto}
.ufind li button{display:block;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:8px;background:none;text-align:left;font:500 14px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:#e9dfc8;overflow-wrap:anywhere}
.ufind li button:hover,.ufind li button.on{background:rgba(44,50,76,.9)}
.ufind li button.grp{color:#e8c98a;font:600 18px 'Cormorant Garamond',Georgia,serif;letter-spacing:.03em}
.ufind .unone{margin:8px 4px 2px;font-style:italic;font-size:18px;color:var(--dim)}
.ustar .uall{margin-top:12px;margin-left:6px;min-height:48px}
.ushow{position:absolute;z-index:9;top:calc(64px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:min(340px,calc(100% - 24px));box-sizing:border-box;padding:8px 10px 10px;border-radius:18px;background:rgba(6,9,22,.96);border:1px solid rgba(238,242,255,.3);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ushow h2{margin:6px 6px 4px;font-size:13px;font-weight:500;letter-spacing:.3em;color:#cdbf9f}
.ushow label{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 6px;border-radius:8px;font-size:19px;line-height:1.15;color:#f1ebdd;cursor:pointer}
.ushow label:hover{background:rgba(44,50,76,.6)}
.ushow label small{display:block;font-size:15px;font-style:italic;color:var(--dim)}
.ushow input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:44px;height:26px;margin:0;border-radius:13px;border:1.5px solid #8a6a3a;background:#0b0f1e;cursor:pointer;transition:background .2s,border-color .2s}
.ushow input::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#8a7a5c;transition:transform .2s,background .2s}
.ushow input:checked{background:#5a1830;border-color:#ff8aa6}
.ushow input:checked::after{transform:translateX(18px);background:#fff3e6}
.ushow input:focus-visible{outline:2px solid #ff5d86;outline-offset:3px}
.ushow .udot{flex:none;width:12px;height:12px;border-radius:50%;box-sizing:border-box}
.uni.walking .ushow{display:none}
.ushow{max-height:calc(100vh - 84px);max-height:calc(100svh - 84px);overflow-y:auto;overscroll-behavior:contain}
.uarr{display:flex;flex-direction:column;gap:6px;margin:2px 0 10px}
.uarr button{display:block;width:100%;box-sizing:border-box;text-align:left;padding:8px 12px 9px;border-radius:10px;border:1.5px solid #5d5340;background:#0b0f1e;font-size:19px;font-weight:600;line-height:1.15;color:#f1ebdd}
.uarr button small{display:block;margin-top:2px;font-size:15px;font-weight:500;font-style:italic;color:var(--dim)}
.uarr button:hover{background:rgba(44,50,76,.7)}
.uarr button[aria-checked="true"]{border-color:#ff8aa6;background:#3a1424;box-shadow:0 0 14px rgba(194,29,78,.35)}
.ushow .ubtn{width:100%;margin-top:8px;border-radius:8px}
.utime{position:absolute;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(620px,calc(100% - 24px));box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;background:rgba(6,9,22,.94);border:1px solid rgba(238,242,255,.3);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.utime .utmid{flex:1;min-width:0}
.utime p{margin:0 2px 2px;font:500 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.utime input{display:block;width:100%;height:28px;margin:0;accent-color:#c21d4e;cursor:pointer}
.utime .ubtn{min-width:78px;padding:0 12px;border-radius:8px}
.utime .uclose{min-width:48px;width:48px;padding:0;font-size:26px}
.uni.replaying .ustar{bottom:calc(92px + env(safe-area-inset-bottom))}
.uni.replaying .uhint{bottom:calc(104px + env(safe-area-inset-bottom))}
.uni.walking .utime{display:none}
@media (max-width:599px){.ucorner{top:calc(54px + env(safe-area-inset-top));gap:4px}.ucorner .ubtn{padding:0 10px;font-size:17px}.ushow{top:calc(116px + env(safe-area-inset-top));max-height:calc(100vh - 132px);max-height:calc(100svh - 132px)}.utime{padding-top:30px}.utime p{position:absolute;left:14px;right:14px;top:8px;margin:0}.uni.replaying .ustar{bottom:calc(112px + env(safe-area-inset-bottom))}.uni.replaying .uhint{bottom:calc(124px + env(safe-area-inset-bottom))}.uchip{top:calc(118px + env(safe-area-inset-top))}.ufind{top:calc(116px + env(safe-area-inset-top))}}
.umark{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));margin:0;max-width:calc(100% - 170px);font-size:13px;letter-spacing:.3em;line-height:1.5;color:#cdbf9f;text-shadow:0 0 8px #000;pointer-events:none;white-space:nowrap}
.umark b{display:block;font-size:15px;letter-spacing:.08em;font-weight:500;font-style:italic;color:var(--dim);overflow:hidden;text-overflow:ellipsis}

/* a star's card, opened by a tap on the sky */
.ustar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(480px,calc(100% - 24px));box-sizing:border-box;padding:14px 60px 16px 18px;border-radius:18px;
  background:rgba(6,9,22,.95);border:1px solid rgba(238,242,255,.3);box-shadow:0 10px 40px rgba(0,0,0,.6);color:#f1ebdd;text-align:left;user-select:text;-webkit-user-select:text}
.ustar p{margin:0}
.ustar .uname{font-size:18px;font-weight:600;letter-spacing:.05em;color:#e8c98a;overflow-wrap:anywhere}
.ustar .umeta{margin-top:3px;font:500 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--dim)}
.ustar .uline{margin-top:8px;font-size:19px;line-height:1.32;overflow-wrap:break-word;max-height:7.9em;overflow-y:auto}
.ustar .uclose{position:absolute;top:6px;right:6px;width:48px;padding:0;font-size:26px}
.ustar .ubtn.go{margin-top:12px}

/* inside a block: the place's address, its words whole, and the two ways to move */
.uplace{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(600px,calc(100% - 24px));box-sizing:border-box;margin:0;pointer-events:none}
.uplace p{margin:0}
#paddr{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--gold);letter-spacing:.1em;font-size:14px;min-height:18px;text-shadow:0 0 8px #000;overflow-wrap:anywhere}
#pline{margin-top:6px;font-size:20px;line-height:1.3;height:5.2em;max-height:30vh;max-height:30svh;overflow-y:auto;overscroll-behavior:contain;color:var(--ink);text-shadow:0 0 10px #000,0 0 3px #000;
  pointer-events:auto;user-select:text;-webkit-user-select:text;white-space:pre-wrap;overflow-wrap:break-word;scrollbar-width:thin;scrollbar-color:#8a6a3a transparent}
.uways{display:flex;gap:8px;margin-top:10px;pointer-events:auto}
.uways .ubtn{flex:1;border-radius:8px}
.uways .ubtn.go{flex:1.7}
.uhint{position:absolute;z-index:5;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom));margin:0;text-align:center;font-style:italic;font-size:20px;line-height:1.3;color:var(--ink);text-shadow:0 0 10px #000,0 0 4px #000;pointer-events:none;opacity:0;transition:opacity 1.2s}
.uhint.on{opacity:1}
.uni.walking .uhint{bottom:calc(250px + env(safe-area-inset-bottom))}
.unotice{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));margin:0;width:max-content;max-width:calc(100% - 28px);padding:4px 8px 4px 18px;box-sizing:border-box;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
  border:1px solid rgba(238,242,255,.25);border-radius:26px;background:rgba(3,5,12,.86);font-size:19px;font-style:italic}
.unojs{position:absolute;left:16px;right:16px;top:45%;margin:0;text-align:center;font-style:italic;font-size:21px;color:rgba(238,242,255,.8)}
@media (min-width:900px) and (min-height:560px){
  .ucorner{top:16px;right:20px}
  .umark{top:20px;left:24px}
  #pline{font-size:21px}
}
</style>
</head>
<body>
<main class="uni" id="uni">
<canvas id="sky" aria-hidden="true"></canvas>

<p class="umark">THE PSCALE UNIVERSE<b id="ucount"></b></p>
<div class="ucorner">
  <button type="button" class="ubtn uhere" id="present" hidden>Present: 1</button>
  <button type="button" class="ubtn ufindb" id="findb" aria-expanded="false">Find</button>
  <button type="button" class="ubtn" id="showb" aria-expanded="false">Show</button>
  <button type="button" class="ubtn" id="sound" aria-pressed="false">Sound: off</button>
</div>

<button type="button" class="ubtn uchip" id="chip" hidden></button>
<div class="ufind" id="find" hidden>
  <input id="q" type="search" placeholder="Find a star by name" aria-label="Find a star by name" autocomplete="off" autocapitalize="off" spellcheck="false">
  <ul id="hits"></ul>
</div>

<div class="ushow" id="show" hidden>
  <h2>ARRANGEMENT</h2>
  <div class="uarr" role="radiogroup" aria-label="How the stars are arranged">
    <button type="button" role="radio" aria-checked="true" data-arr="galaxy">The galaxy<small>an arm for each kind of block; the rest is chance</small></button>
    <button type="button" role="radio" aria-checked="false" data-arr="kin">Time and kin<small>out from the centre, when it was born; round the circle, whose it is</small></button>
  </div>
  <h2>SHOW</h2>
  <label><input type="checkbox" role="switch" data-show="ripples"><span class="udot" style="border:1.5px solid #ffd9a0"></span><span>Being written<small>rings on stars written in the last ten minutes</small></span></label>
  <label><input type="checkbox" role="switch" data-show="glow"><span class="udot" style="background:#ffc478;box-shadow:0 0 8px #ffc478"></span><span>Recently written<small>a glow on stars written in the last three days</small></span></label>
  <label><input type="checkbox" role="switch" data-show="born"><span class="udot" style="background:linear-gradient(#fff,#fff) center/100% 1.5px no-repeat,linear-gradient(#fff,#fff) center/1.5px 100% no-repeat;border-radius:0"></span><span>Newly born<small>a spark on stars that arrived in the last day</small></span></label>
  <label><input type="checkbox" role="switch" data-show="present"><span class="udot" style="border:2px solid #78ebe1"></span><span>Who is present<small>anyone who has said they are here</small></span></label>
  <label><input type="checkbox" role="switch" data-show="names"><span class="udot" style="background:#cdbf9f;border-radius:2px;height:3px"></span><span>Names<small>on the stars nearest you</small></span></label>
  <label><input type="checkbox" role="switch" data-show="compass"><span class="udot" style="border:1px solid #8fa2e8"></span><span>Compass<small>rings of time and names round the rim, in Time and kin</small></span></label>
  <label><input type="checkbox" role="switch" data-show="dust"><span class="udot" style="background:#b8c8ff;width:4px;height:4px;margin:0 4px"></span><span>Far dust<small>the faint points behind the stars</small></span></label>
  <label><input type="checkbox" role="switch" data-show="turn"><span class="udot" style="border:1.5px dashed #cdbf9f"></span><span>The sky turning<small>slowly, when left alone</small></span></label>
  <button type="button" class="ubtn" id="tshow">Watch the stars being born</button>
</div>
<div class="utime" id="time" hidden>
  <button type="button" class="ubtn" id="tplay">Pause</button>
  <div class="utmid"><p id="twhen" aria-live="off"></p><input type="range" id="tr" min="0" max="1000" value="0" aria-label="When in the life of the sky"></div>
  <button type="button" class="ubtn uclose" id="tclose" aria-label="Back to now">×</button>
</div>

<aside class="ustar" id="starcard" hidden aria-live="polite">
  <button type="button" class="ubtn uclose" id="sclose" aria-label="Close the card">×</button>
  <p class="uname" id="sname"></p>
  <p class="umeta" id="smeta"></p>
  <p class="uline" id="sline"></p>
  <button type="button" class="ubtn go" id="swalk" hidden>Go in</button>
  <button type="button" class="ubtn uall" id="sall" hidden></button>
</aside>

<div class="uplace" id="place" hidden>
  <p id="paddr" aria-live="polite"></p>
  <p id="pline" aria-live="polite" tabindex="0"></p>
  <div class="uways"><button type="button" class="ubtn" id="tup">Up</button><button type="button" class="ubtn go" id="tin">Go in</button></div>
</div>
<p class="uhint" id="hint" aria-live="polite"></p>

<p class="unotice" id="notice" role="status" hidden><span>Pscale could not be reached.</span> <button type="button" class="ubtn" id="again">Try again</button></p>
<noscript><p class="unojs">This page draws the live Pscale sky, and needs JavaScript to do it.</p></noscript>
</main>

<script>
/* The Pscale universe: the sky, the moons and the dive of The Approach, standing alone. No film and no dial: the hand is on the sky
   itself. Where the film's page stopped at what the film needed, this one goes as far as a block goes: every block is read whole
   whatever its size, and a place kept inside another's own line (the nested underscore, a block's deeper floors) opens as its heart.
   Plain JavaScript, no libraries. It reads Pscale and writes nothing to it. */
(function () {
  'use strict';
  var WIRE = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
  var ARMS = ['archive', 'pool', 'spine', 'function', 'liquid', 'grain', 'passport', 'now', 'shell'];
  var TAU = Math.PI * 2;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('uni'), canvas = $('sky'), ctx = canvas.getContext('2d');
  if (!ctx) return;
  var elNotice = $('notice'), elSound = $('sound');
  var CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── small helpers ── */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function easeOut(t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rnd(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hh(s, k) { var x = 2166136261 ^ k; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } x ^= x >>> 13; x = Math.imul(x, 0x5bd1e995); x ^= x >>> 15; return (x >>> 0) / 4294967295; }
  function now() { return performance.now() / 1000; }

  /* ── reading Pscale ── */
  var index = null, reading = 0;
  function get(url, wait) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, wait || 20000);
    return fetch(url, { headers: { Accept: 'application/json' }, signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { clearTimeout(timer); return j; }, function (e) { clearTimeout(timer); throw e; });
  }
  function readIndex() {
    var mine = ++reading;
    elNotice.hidden = true;
    return get(WIRE).then(function (j) {
      if (!j || typeof j !== 'object' || !Array.isArray(j.blocks)) throw new Error('not an index');
      applyIndex(j); readPresence();
      if (ARR === 'kin') { orb.dist = restFor('kin'); orb.pitch = 0.98; orb.yaw = Math.PI; KB = 1; BAS = null; }
      if (!polling) polling = setInterval(function () { if (!document.hidden) refresh(); }, EVERY * 1000);
      showHint(coarse ? 'Drag to turn the sky. Pinch to come closer. Tap a star to read it.' : 'Drag to turn the sky. Scroll to come closer. Click a star to read it.');
    }).catch(function () { if (mine === reading) elNotice.hidden = false; });
  }
  $('again').addEventListener('click', function () { readIndex(); });
  /* ── live: the index is read again every minute. A block whose record of when it last changed has moved is a star being written:
        it ripples for ten minutes, and what was kept of it is let go so the next walk reads it fresh. Beside the index, the beach's
        presence block: one slot per agent, overwritten by its heartbeat, saying who stands at which block. Reading leaves no trace
        on the beach, so only those who have said they are here can be shown. ── */
  var EVERY = 60, polling = 0, idxNow = 0, idxPerf = 0, lastRead = 0, HOT = [], HOT_S = 600, PRES_RAW = [], PRES = [], PRES_H = 6, presI = 0;
  function serverNow() { return idxNow + (performance.now() - idxPerf); }
  function applyIndex(j) {
    var old = index && index.touched, changed = [], n, had = null, fresh = [];
    if (index) { had = {}; B3.forEach(function (s0) { had[s0.name] = 1; }); }
    index = j; idxNow = Date.parse((j.now && j.now.iso) || '') || Date.now(); idxPerf = performance.now(); lastRead = now();
    if (old) { var tc = j.touched || {}; for (n in tc) if (tc[n] !== old[n]) changed.push(n); }

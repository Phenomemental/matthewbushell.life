<title>The Pscale universe, Matthew Bushell</title>
<meta name="description" content="Every block on Pscale as a star. Turn the sky, come close, and walk into any star as far down as it goes.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* The universe alone: the live Pscale sky of The Approach (film:the-approach 6.42, 6.8, 6.82) with the film and the dial taken away.
   Every block is a star; a star opens into its places as moons; a moon opens into its own, as far down as the block goes. */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#04060b}
.uni{--ink:#efe6d6;--dim:#b9ab90;--gold:#d9b36c;
  position:relative;height:100vh;height:100svh;overflow:hidden;background:#04060b;color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.uni #sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.uni.dragging #sky{cursor:grabbing}
.uni button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.uni button:focus-visible{outline:2px solid #ff5d86;outline-offset:3px}
.uni [hidden]{display:none!important}
.ubtn{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:0;padding:0 18px;border:1.5px solid #eadfc4;border-radius:999px;
  background:rgba(12,14,26,.94);color:#fff8ea;font-family:'Cormorant Garamond',Garamond,serif;font-size:19px;font-weight:600;letter-spacing:.03em;line-height:1.1;white-space:nowrap;
  box-shadow:0 2px 14px rgba(0,0,0,.55)}
.ubtn:hover{background:rgba(44,50,76,.96)}
.ubtn:disabled{opacity:.36;cursor:default}
.ubtn.go{background:#c21d4e;border-color:#ff8aa6;color:#fff;box-shadow:0 0 26px rgba(194,29,78,.5)}
.ucorner{position:absolute;z-index:8;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;padding:5px;border-radius:32px;background:rgba(3,5,12,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ucorner .ubtn{padding:0 14px;font-size:18px}
.umark{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));margin:0;max-width:calc(100% - 170px);font-size:13px;letter-spacing:.3em;line-height:1.5;color:#cdbf9f;text-shadow:0 0 8px #000;pointer-events:none;white-space:nowrap}
.umark b{display:block;font-size:15px;letter-spacing:.08em;font-weight:500;font-style:italic;color:var(--dim);overflow:hidden;text-overflow:ellipsis}

/* a star's card, opened by a tap on the sky */
.ustar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(480px,calc(100% - 24px));box-sizing:border-box;padding:14px 60px 16px 18px;border-radius:18px;
  background:rgba(6,9,22,.95);border:1px solid rgba(238,242,255,.3);box-shadow:0 10px 40px rgba(0,0,0,.6);color:#f1ebdd;text-align:left;user-select:text;-webkit-user-select:text}
.ustar p{margin:0}
.ustar .uname{font-size:18px;font-weight:600;letter-spacing:.05em;color:#e8c98a;overflow-wrap:anywhere}
.ustar .umeta{margin-top:3px;font:500 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--dim)}
.ustar .uline{margin-top:8px;font-size:19px;line-height:1.32;overflow-wrap:break-word;max-height:7.9em;overflow-y:auto}
.ustar .uclose{position:absolute;top:6px;right:6px;width:48px;padding:0;font-size:26px}
.ustar .ubtn.go{margin-top:12px}

/* inside a block: the place's address, its words whole, and the two ways to move */
.uplace{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(600px,calc(100% - 24px));box-sizing:border-box;margin:0;pointer-events:none}
.uplace p{margin:0}
#paddr{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--gold);letter-spacing:.1em;font-size:14px;min-height:18px;text-shadow:0 0 8px #000;overflow-wrap:anywhere}
#pline{margin-top:6px;font-size:20px;line-height:1.3;height:5.2em;max-height:30vh;max-height:30svh;overflow-y:auto;overscroll-behavior:contain;color:var(--ink);text-shadow:0 0 10px #000,0 0 3px #000;
  pointer-events:auto;user-select:text;-webkit-user-select:text;white-space:pre-wrap;overflow-wrap:break-word;scrollbar-width:thin;scrollbar-color:#8a6a3a transparent}
.uways{display:flex;gap:8px;margin-top:10px;pointer-events:auto}
.uways .ubtn{flex:1;border-radius:8px}
.uways .ubtn.go{flex:1.7}
.uhint{position:absolute;z-index:5;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom));margin:0;text-align:center;font-style:italic;font-size:20px;line-height:1.3;color:var(--ink);text-shadow:0 0 10px #000,0 0 4px #000;pointer-events:none;opacity:0;transition:opacity 1.2s}
.uhint.on{opacity:1}
.uni.walking .uhint{bottom:calc(250px + env(safe-area-inset-bottom))}
.unotice{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));margin:0;width:max-content;max-width:calc(100% - 28px);padding:4px 8px 4px 18px;box-sizing:border-box;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
  border:1px solid rgba(238,242,255,.25);border-radius:26px;background:rgba(3,5,12,.86);font-size:19px;font-style:italic}
.unojs{position:absolute;left:16px;right:16px;top:45%;margin:0;text-align:center;font-style:italic;font-size:21px;color:rgba(238,242,255,.8)}
@media (min-width:900px) and (min-height:560px){
  .ucorner{top:16px;right:20px}
  .umark{top:20px;left:24px}
  #pline{font-size:21px}
}
</style>

<body>
<main class="uni" id="uni">
<canvas id="sky" aria-hidden="true"></canvas>

<p class="umark">THE PSCALE UNIVERSE<b id="ucount"></b></p>
<div class="ucorner">
  <button type="button" class="ubtn" id="sound" aria-pressed="false">Sound: off</button>
</div>

<aside class="ustar" id="starcard" hidden aria-live="polite">
  <button type="button" class="ubtn uclose" id="sclose" aria-label="Close the card">×</button>
  <p class="uname" id="sname"></p>
  <p class="umeta" id="smeta"></p>
  <p class="uline" id="sline"></p>
  <button type="button" class="ubtn go" id="swalk" hidden>Go in</button>
</aside>

<div class="uplace" id="place" hidden>
  <p id="paddr" aria-live="polite"></p>
  <p id="pline" aria-live="polite" tabindex="0"></p>
  <div class="uways"><button type="button" class="ubtn" id="tup">Up</button><button type="button" class="ubtn go" id="tin">Go in</button></div>
</div>
<p class="uhint" id="hint" aria-live="polite"></p>

<p class="unotice" id="notice" role="status" hidden><span>Pscale could not be reached.</span> <button type="button" class="ubtn" id="again">Try again</button></p>
<noscript><p class="unojs">This page draws the live Pscale sky, and needs JavaScript to do it.</p></noscript>
</main>

<script>
/* The Pscale universe: the sky, the moons and the dive of The Approach, standing alone. No film and no dial: the hand is on the sky
   itself. Where the film's page stopped at what the film needed, this one goes as far as a block goes: every block is read whole
   whatever its size, and a place kept inside another's own line (the nested underscore, a block's deeper floors) opens as its heart.
   Plain JavaScript, no libraries. It reads Pscale and writes nothing to it. */
(function () {
  'use strict';
  var WIRE = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
  var ARMS = ['archive', 'pool', 'spine', 'function', 'liquid', 'grain', 'passport', 'now', 'shell'];
  var TAU = Math.PI * 2;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('uni'), canvas = $('sky'), ctx = canvas.getContext('2d');
  if (!ctx) return;

  var CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── small helpers ── */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  function hh(s, k) { var x = 2166136261 ^ k; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } x ^= x >>> 13; x = Math.imul(x, 0x5bd1e995); x ^= x >>> 15; return (x >>> 0) / 4294967295; }
  function now() { return performance.now() / 1000; }

  /* ── reading Pscale ── */
  var index = null, reading = 0;
  function get(url, wait) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, wait || 20000);
    return fetch(url, { headers: { Accept: 'application/json' }, signal: ctl ? ctl.signal : undefined })

      .then(function (j) { clearTimeout(timer); return j; }, function (e) { clearTimeout(timer); throw e; });

  function readIndex() {
    var mine = ++reading;
    elNotice.hidden = true;
    return get(WIRE).then(function (j) {
      if (!j || typeof j !== 'object' || !Array.isArray(j.blocks)) throw new Error('not an index');
      index = j; beachStars();

  }
  $('again').addEventListener('click', function () { readIndex(); });
  function sealed(n) { return !!n && typeof n === 'object' && n['9'] && typeof n['9'] === 'object' && n['9']._ === 'gray'; }
  function lineOf(n) {
    if (sealed(n)) return 'This line is sealed.';
    var guard = 0;
    while (n && typeof n === 'object' && guard++ < 24) n = n._;
    return typeof n === 'string' ? n : '';
  }
  function tidy(s) { return String(s).replace(/\s*\((?:AHEAD|BEHIND)\b[^)]*\)/g, ''); }
  function story(n) { return tidy(lineOf(n)).trim(); }

  /* ── the live sky: every block a star from the live index, in three dimensions ── */
  var dust = [], B3 = [];
  (function () { var r = rnd(81); function gg() { var u = 0; for (var k = 0; k < 4; k++) u += r(); return (u - 2) * 0.9; } for (var i = 0; i < 1400; i++) dust.push([gg() * 1.6, gg() * 0.45, gg() * 1.6, 0.12 + r() * 0.3]); })();
  function sprite(inner, outer) {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g2 = c.getContext('2d'), gr = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, inner); gr.addColorStop(0.1, inner); gr.addColorStop(0.32, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');

  }

  var SPR_NEW = sprite('rgba(255,246,226,1)', 'rgba(255,196,120,.4)'), RECENT = [], RECENT_K = 0.55, RECENT_H = 72;
  function beachStars() {
    var bytes = (index && index.bytes) || {}, names = ((index && index.blocks) || []).map(function (b) { return typeof b === 'string' ? b : (b && b.name) || ''; }).filter(Boolean);
    B3 = names.map(function (name) {
      var kind = name.split(':')[0], arm = ARMS.indexOf(kind), r, ang, y, size = Number(bytes[name]) || 300;
      if (arm >= 0) { r = 0.15 + 0.85 * Math.pow(hh(name, 1), 0.7); ang = arm * TAU / 9 + r * 3.2 + (hh(name, 2) - 0.5) * 0.35; y = (hh(name, 3) - 0.5) * 0.05; }
      else { ang = hh(name, 2) * TAU; r = 0.1 + 0.95 * Math.pow(hh(name, 1), 0.5); y = (hh(name, 3) - 0.5) * 0.25; }
      var u = hh(name, 4);
      return { name: name, size: size, p: [r * Math.cos(ang), y, r * Math.sin(ang)], br: 0.25 + 1.6 * Math.min(1, Math.max(0, Math.log(Math.max(size, 50)) / Math.LN10 - 1.6)) / 3.2,
        tint: u < 0.2 ? 2 : u < 0.62 ? 0 : 1, ph: hh(name, 5) * TAU, sp: 0.25 + u * 0.5 };
    });
    /* how recently each block was written, from the index's own record; the newest glow amber */
    var tch = (index && index.touched) || {}, nowT = Date.parse((index && index.now && index.now.iso) || '') || Date.now();
    B3.forEach(function (s) { var w = Date.parse(tch[s.name] || ''), age = (nowT - w) / 3600000; s.recent = w && age >= 0 && age < RECENT_H ? Math.pow(1 - age / RECENT_H, 1.5) : 0; });

    $('ucount').textContent = B3.length.toLocaleString('en-GB') + ' stars, read live';
  }
  var W = 0, H = 0, DPR = 1, wide = false, coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var orb = { yaw: 0.6, pitch: 0.72, dist: 2.4, tgt: [0, 0, 0] }, glide = null, DMIN = 0.22, DMAX = 4.6, BAS = null;
  function seat() { return H * (wide ? 0.44 : 0.4); }
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    wide = W >= 900 && H >= 560;
    BAS = null; M.cx = W / 2; M.cy = seat(); M.R0 = Math.min(W * 0.39, H * 0.25);
  }
  function basis() {
    var cp = Math.cos(orb.pitch), sp = Math.sin(orb.pitch), cy = Math.cos(orb.yaw), sy = Math.sin(orb.yaw), t = orb.tgt;
    var eye = [t[0] + orb.dist * cp * cy, t[1] + orb.dist * sp, t[2] + orb.dist * cp * sy];
    var fw = [t[0] - eye[0], t[1] - eye[1], t[2] - eye[2]], n = Math.sqrt(fw[0] * fw[0] + fw[1] * fw[1] + fw[2] * fw[2]) || 1;
    fw = [fw[0] / n, fw[1] / n, fw[2] / n];
    var r = [-fw[2], 0, fw[0]]; n = Math.sqrt(r[0] * r[0] + r[2] * r[2]) || 1; r = [r[0] / n, 0, r[2] / n];
    var u = [r[1] * fw[2] - r[2] * fw[1], r[2] * fw[0] - r[0] * fw[2], r[0] * fw[1] - r[1] * fw[0]];
    BAS = { eye: eye, f: fw, r: r, u: u, S: Math.min(W, H) * (wide ? 0.9 : 1.12), cx: W / 2, cy: seat() };
    return BAS;
  }
  function oproj(p) {
    var b = BAS || basis(), d0 = p[0] - b.eye[0], d1 = p[1] - b.eye[1], d2 = p[2] - b.eye[2], z = d0 * b.f[0] + d1 * b.f[1] + d2 * b.f[2];
    if (z <= 0.01) return null;
    return [b.cx + (d0 * b.r[0] + d1 * b.r[1] + d2 * b.r[2]) * b.S / z, b.cy - (d0 * b.u[0] + d1 * b.u[1] + d2 * b.u[2]) * b.S / z, z];
  }
  function starOf(name) { for (var i = 0; i < B3.length; i++) if (B3[i].name === name) return B3[i]; return null; }
  function glideTo(to, dur, fn, done) { glide = { from: { yaw: orb.yaw, pitch: orb.pitch, dist: orb.dist, tgt: orb.tgt.slice() }, to: to, t0: now(), dur: CALM ? 0.01 : dur, fn: fn || ease, done: done }; }

    var k = glide.fn((t - glide.t0) / glide.dur), a = glide.from, b = glide.to, i;

    if (b.dist != null) orb.dist = a.dist * Math.pow(b.dist / a.dist, k);
    if (b.pitch != null) orb.pitch = lerp(a.pitch, b.pitch, k);

  }
  var SK = { dim: 1, to: 1 }, DIMIN = 0.3, NAMED = [];
  function drawSky(t, alpha) {
    var gd = ctx.createLinearGradient(0, 0, 0, H);
    gd.addColorStop(0, '#02040b'); gd.addColorStop(0.55, '#070d24'); gd.addColorStop(1, '#03050c');
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = gd; ctx.fillRect(0, 0, W, H);

      q = oproj(s.p); if (!q || q[0] < -30 || q[0] > W + 30 || q[1] < -30 || q[1] > H + 30) continue;
      var near = Math.min(6, 1.1 / Math.max(q[2], 0.05)), tw = 0.86 + 0.14 * Math.sin(t * s.sp + s.ph);
      var rad = (1.4 + s.br * 3.2) * (0.55 + near * 0.45) * (wide ? 1 : 1.3);
      ctx.globalAlpha = Math.min(1, alpha * Math.min(1, 0.38 + s.br * 0.55) * tw);

    }
    for (i = 0; i < RECENT.length; i++) {   /* blocks written in the last three days glow */
      s = RECENT[i]; q = oproj(s.p); if (!q || q[0] < -40 || q[0] > W + 40 || q[1] < -40 || q[1] > H + 40) continue;
      var nr = Math.min(6, 1.1 / Math.max(q[2], 0.05)), gr = (5 + 13 * s.recent) * (0.6 + nr * 0.4) * (wide ? 1 : 1.2);
      ctx.globalAlpha = Math.min(1, alpha * RECENT_K * (0.3 + 0.7 * s.recent) * (0.72 + 0.28 * Math.sin(t * 1.3 + s.ph)));

      for (i = 0; i < NAMED.length && i < 14; i++) { var nm = NAMED[i]; ctx.globalAlpha = alpha * clamp((0.62 - nm[0]) / 0.25, 0, 1) * 0.8; ctx.fillStyle = '#cdbf9f'; ctx.fillText(nm[3].length > 34 ? nm[3].slice(0, 33) + '…' : nm[3], nm[1], nm[2]); }

  /* ── sound: off until asked for. The sound of the universe from the film's page (6.73), made in code, nothing loaded: a low held
